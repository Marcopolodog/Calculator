<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger · personal finance</title>
<style>
:root{
  --bg:#F4F1EA;--ws:#FBF9F5;--s1:#FFFFFF;--s2:#F0ECE3;--edge:#DDD6C8;
  --text:#22262B;--muted:#5E6470;--muted2:#6F747C;
  --pri:#1E3A5F;--pri-ink:#FFFFFF;--pos:#2E7D5B;--pos-ink:#FFFFFF;--acc:#B5573B;--gold:#B08A3E;--neg:#B23A3A;--warn:#9A6A12;
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;
  box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)
}
:root[data-theme="dark"]{
  --bg:#16191C;--ws:#1B1F23;--s1:#20252A;--s2:#2A3036;--edge:#343B42;
  --text:#ECE8DF;--muted:#A5ABB3;--muted2:#8B9199;
  --pri:#8FB0DC;--pri-ink:#0F1A2A;--pos:#6FBF98;--pos-ink:#0F241B;--acc:#E29A7C;--gold:#D6B36A;--neg:#E27D7D;--warn:#D9A441
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:110px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}
.hidden{display:none!important}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

/* header */
#top{position:sticky;top:0;z-index:30;background:var(--ws);border-bottom:1px solid var(--edge);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:8px;max-width:1080px;margin:0 auto;padding:10px 16px}
#brand{font:700 1.3rem/1 var(--serif);letter-spacing:.01em;white-space:nowrap}
#brand span{font:400 .72rem/1 -apple-system,"Segoe UI",sans-serif;color:var(--muted);margin-left:8px;letter-spacing:.04em}
.grow{flex:1;min-width:0}
.hbtn,#cur{background:var(--s1);border:1px solid var(--edge);border-radius:8px;padding:0 12px;height:36px;font-size:.85rem;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
#cur{padding:0 6px;cursor:pointer}
.hbtn:hover,#cur:hover{border-color:var(--pri)}
.hbtn:active{transform:scale(.97)}
#tabs{display:flex;gap:2px;max-width:1080px;margin:0 auto;padding:0 12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:none;background:transparent;border:0;border-bottom:2px solid transparent;padding:10px 12px;font-size:.88rem;color:var(--muted);white-space:nowrap;margin-bottom:-1px}
#tabs button:hover{color:var(--text)}
#tabs button[aria-selected="true"]{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}

/* workspace */
#workspace{max-width:1080px;margin:0 auto;padding:24px 16px 64px}
.enter{animation:enter .2s ease both}
@keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.hero{padding:0 0 22px;margin-bottom:20px;border-bottom:1px solid var(--edge)}
.kicker{font-size:.72rem;font-weight:600;letter-spacing:.1em;color:var(--muted2);text-transform:uppercase;margin:0 0 6px}
.headline{font-size:2.4rem;font-weight:650;letter-spacing:-.015em;margin:0 0 4px;line-height:1.1}
.sub{color:var(--muted);font-size:.92rem;margin:0}
.metricrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:16px 24px;margin-top:18px}
.metric .lbl{font-size:.72rem;color:var(--muted2);letter-spacing:.05em;text-transform:uppercase}
.metric .v{font-size:1.25rem;font-weight:600;margin-top:2px}
.panel{background:var(--s1);border:1px solid var(--edge);border-radius:10px;padding:20px}
.panel+.panel,.split+.panel,.panel+.split,.split+.split{margin-top:16px}
.panel h3{margin:0 0 14px;font:600 1.02rem/1.2 var(--serif);color:var(--text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.split{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:20px;align-items:start}
.split>.panel+.panel,.split>div>.panel+.panel,.split+.panel,.panel+.split,.split+.split{margin-top:16px}
.split .panel+.panel,.split+.panel,.panel+.split,.split+.split{margin-top:16px}
.tone-b{color:var(--pri)}.tone-v{color:var(--acc)}.tone-g{color:var(--pos)}.tone-r{color:var(--neg)}.tone-w{color:var(--warn)}

/* forms */
label.f{display:block}
label.f span{display:block;color:var(--muted);font-size:.8rem;margin-bottom:5px}
.in{display:flex;align-items:center;background:var(--s1);border:1px solid var(--edge);border-radius:8px;padding:0 10px;transition:border-color .15s,box-shadow .15s;min-height:42px}
.in:hover{border-color:var(--muted2)}
.in:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)}
.in input{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:9px 0;font-size:1rem}
select.in{width:100%;padding:0 8px}
.in i{color:var(--muted);font-style:normal;padding:0 4px 0 0;font-size:.9rem}
.in input+i{padding:0 0 0 4px}
.row{display:flex;gap:10px;align-items:flex-end}.row>*{flex:1;min-width:0}
.split>*,.grid2>*,.grid3>*,label.f,.in{min-width:0}
.clr{background:transparent;border:0;color:var(--muted2);font-size:1.1rem;line-height:1;padding:4px 6px;margin-left:2px;border-radius:6px;flex:none}
.clr:hover{color:var(--text);background:var(--s2)}
.seg{display:inline-flex;background:var(--s2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-size:.83rem;padding:6px 12px;border-radius:6px;transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--s1);color:var(--text);font-weight:600;box-shadow:0 0 0 1px var(--edge)}
.btn{display:inline-block;background:var(--pri);color:var(--pri-ink);border:0;border-radius:8px;padding:0 16px;height:38px;line-height:38px;font-size:.88rem;font-weight:600;text-decoration:none}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.98)}
.chip{background:var(--s1);border:1px solid var(--edge);border-radius:8px;padding:6px 12px;font-size:.82rem;color:var(--text)}
.chip:hover{border-color:var(--pri)}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:.86rem;color:var(--muted)}
.rng{width:100%;height:30px;accent-color:var(--pri);cursor:pointer;touch-action:pan-y}
.note{color:var(--muted2);font-size:.8rem;margin-top:10px}
.demo{display:inline-block;margin-top:10px;font-size:.72rem;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:2px 8px}

/* charts & lists */
svg{display:block;width:100%;height:auto;touch-action:pan-y}
.donutwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.legend{list-style:none;margin:0;padding:0;font-size:.86rem;width:100%;max-width:260px}
.legend li{display:flex;justify-content:space-between;gap:10px;padding:6px 4px;border-top:1px solid var(--edge)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
[data-hl]{cursor:pointer;transition:opacity .15s,stroke-width .15s}
circle[data-hl]{transition:opacity .15s,stroke-width .15s,stroke-dasharray .35s,stroke-dashoffset .35s}
circle.on{stroke-width:31}.dim{opacity:.3}li.on{background:var(--s2);border-radius:6px}
.flow{height:10px;background:var(--s2);border-radius:5px;overflow:hidden;margin-top:6px}.flow .fx{height:100%;border-radius:5px;transition:width .25s}
.flowl{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin:6px 0 12px}
.glrow{display:grid;grid-template-columns:130px 1fr 42px;gap:10px;align-items:center;font-size:.83rem;color:var(--muted);margin:8px 0}
.glrow .flow{position:relative;margin:0;overflow:visible}.glrow b{color:var(--text);text-align:right}
.gmark{position:absolute;top:-3px;width:2px;height:16px;background:var(--text);opacity:.5}
.erow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--edge)}
.erow:first-of-type{border-top:0}
.en b{display:block;font-weight:600}.en span{font-size:.78rem;color:var(--muted)}
.ea{font-weight:600;text-align:right}.ea small{color:var(--muted2);font-weight:400}
.eb{display:flex;gap:4px}.eb button{background:var(--s1);border:1px solid var(--edge);border-radius:6px;padding:5px 9px;font-size:.78rem;min-height:32px}
.eb button:hover{border-color:var(--pri)}
.roles{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0;padding:0}
.roles li{list-style:none;color:var(--muted);font-size:.8rem}

/* percentile scale */
.scale{position:relative;height:64px;margin:22px 10px 10px}
.scaletrack{position:absolute;left:0;right:0;top:28px;height:6px;background:linear-gradient(90deg,var(--s2),var(--pri));border-radius:3px}
.tick{position:absolute;top:38px;transform:translateX(-50%);font-size:.66rem;color:var(--muted2);text-align:center;width:60px}
.tick i{display:block;font-style:normal;color:var(--muted)}
.marker{position:absolute;top:0;width:0;height:0}
.marker .flag{position:absolute;top:0;left:0;background:var(--pos);color:var(--pos-ink);font-weight:700;font-size:.72rem;padding:3px 8px;border-radius:6px;white-space:nowrap}
.marker .pin{position:absolute;top:24px;left:-7px;width:14px;height:14px;border-radius:50%;background:var(--pos);border:2px solid var(--s1)}

/* help */
details.help{border-top:1px solid var(--edge)}
details.help:last-of-type{border-bottom:1px solid var(--edge)}
details.help summary{cursor:pointer;padding:14px 2px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.help summary::-webkit-details-marker{display:none}
details.help summary::after{content:"+";color:var(--muted);font-size:1.2rem}
details.help[open] summary::after{content:"–"}
details.help .hb{padding:0 2px 16px;color:var(--muted);font-size:.9rem;line-height:1.6}
.hb b{color:var(--text)}.hb ul,.hb ol{margin:6px 0;padding-left:20px}.hb li{margin:4px 0}.hb p{margin:0 0 8px}

/* snapshot preview */
#snap{position:fixed;inset:0;z-index:60;background:rgba(20,22,26,.6);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.snaphead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.snaphead b{font:600 1.15rem var(--serif)}
.snapopts{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px}.snapprev{background:var(--s2);border-radius:8px;padding:8px;margin-bottom:10px}
.snapbox{margin:auto;max-width:780px;width:100%;background:var(--s1);border:1px solid var(--edge);border-radius:10px;padding:12px}
.snapbox img{width:100%;height:auto;border-radius:6px;display:block}.snapbar{display:flex;gap:10px;margin:10px 0}

/* calculator */
#calcOverlay{position:fixed;inset:0;background:rgba(20,22,26,.45);z-index:50;display:flex;align-items:flex-start;justify-content:flex-end;padding:64px 16px 16px;opacity:0;pointer-events:none;transition:opacity .16s}
#calcOverlay.open{opacity:1;pointer-events:auto}
#calc{width:320px;max-width:100%;background:var(--s1);border:1px solid var(--edge);border-radius:12px;padding:14px;transform:translateY(-8px);transition:transform .16s;box-shadow:0 12px 40px rgba(0,0,0,.25)}
#calcOverlay.open #calc{transform:none}
.calchead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calchead>div{display:flex;gap:6px}
.calchead>div>button{background:var(--s1);border:1px solid var(--edge);border-radius:6px;padding:4px 10px;font-size:.78rem;min-height:30px}
.calchead>div>button[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
#calcExpr{color:var(--muted);font-size:.85rem;min-height:18px;text-align:right;white-space:nowrap;overflow-x:auto}
#calcDisp{font-size:1.9rem;font-weight:600;text-align:right;min-height:40px;margin:4px 0 6px;overflow-x:auto;white-space:nowrap}
#calcDisp.s1{font-size:1.3rem}#calcDisp.s2{font-size:1rem}
.dim2,.dim{color:var(--muted2)}
.hint{font-size:.68rem;color:var(--muted2);text-align:right;margin-bottom:10px}
#calcHist{max-height:120px;overflow-y:auto;margin-bottom:8px;border-bottom:1px solid var(--edge)}
#calcHist button{display:block;width:100%;text-align:right;background:transparent;border:0;padding:5px 2px;font-size:.8rem;color:var(--muted)}
#calcHist button:hover{color:var(--text)}
.frac{display:inline-flex;flex-direction:column;align-items:center;font-size:1.1rem;line-height:1.1;vertical-align:middle}
.frac b{border-bottom:2px solid var(--text);padding:0 4px}.frac i{font-style:normal;padding:0 4px}
.err{color:var(--neg);font-size:1.1rem}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keys button{background:var(--s2);border:1px solid transparent;border-radius:8px;padding:12px 0;font-size:1rem;transition:transform .05s,background .1s}
.keys button:hover{border-color:var(--edge)}.keys button:active{transform:scale(.95)}
.keys .op{color:var(--pri);background:color-mix(in srgb,var(--pri) 10%,var(--s2))}
.keys .acc{color:var(--acc)}
.keys .eq{background:var(--pri);color:var(--pri-ink);font-weight:700}
.keys .wide{grid-column:span 3}

.subtabs{display:flex;gap:2px;background:var(--s2);border-radius:8px;padding:3px;margin:0 0 18px;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:1 0 auto;background:transparent;border:0;border-radius:6px;padding:9px 14px;font-size:.86rem;color:var(--muted);white-space:nowrap}
.subtabs button:hover{color:var(--text)}
.subtabs button[aria-selected="true"]{background:var(--s1);color:var(--text);font-weight:600;box-shadow:0 0 0 1px var(--edge)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:color-mix(in srgb,var(--gold) 14%,var(--s1));border:1px solid color-mix(in srgb,var(--gold) 55%,var(--edge));border-radius:8px;padding:9px 12px;font-size:.85rem;margin:0 0 14px}
.ghead{display:flex;justify-content:space-between;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);padding:16px 0 4px;font-weight:600}
.grp:first-of-type .ghead{padding-top:4px}
.erow.total{border-top:2px solid var(--edge);margin-top:8px}.erow.total .en b{font-weight:700}
.empty{text-align:center;padding:20px 8px;color:var(--muted)}.empty b{color:var(--text)}.empty p{margin:6px 0 12px;font-size:.88rem}
.prev{font-size:.83rem;color:var(--pos);margin:8px 0 0;min-height:1.3em}
.in.bad{border-color:var(--neg)}.prev.off{color:var(--muted2)}
.row.keep{flex-wrap:nowrap}.row.keep>*{flex:1 1 0}
.eb button{min-height:36px}
@media (max-width:720px){
  .headline{font-size:2rem}
  .split,.split[style]{grid-template-columns:1fr!important}
  .grid2{grid-template-columns:1fr}
  .erow{grid-template-columns:1fr auto}.eb{grid-column:1/-1}
  #brand span{display:none}
  .hbtn .lbl{display:none}.hbtn{padding:0 10px}
  #workspace{padding:20px 14px 64px}
}
@media (max-width:520px){
  .row{flex-wrap:wrap}.row>*{flex:1 1 150px}
  #calcOverlay{align-items:stretch;justify-content:stretch;padding:0}
  #calc{width:100%;max-width:none;height:100%;border-radius:0;display:flex;flex-direction:column;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .keys{flex:1;align-content:center}.keys button{min-height:54px;padding:0;font-size:1.15rem}
  #calcDisp{font-size:2.2rem}
  .tick{width:34px;font-size:.58rem}.tick i{display:none}
  .glrow{grid-template-columns:96px 1fr 38px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header id="top">
  <div class="bar">
    <div id="brand">Ledger<span>personal finance</span></div>
    <div class="grow"></div>
    <select id="cur" aria-label="Currency"></select>
    <button id="themeBtn" class="hbtn" type="button">Dark mode</button>
    <button id="calcBtn" class="hbtn" type="button" aria-haspopup="dialog" aria-label="Open calculator"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:18px;height:18px"><rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M8.5 7h7M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/></svg><span class="lbl">Calculator</span></button>
  </div>
  <nav id="tabs" role="tablist" aria-label="Tools"></nav>
</header>

<main id="workspace"></main>

<div id="calcOverlay">
  <div id="calc" role="dialog" aria-modal="true" aria-label="Calculator">
    <div class="calchead">
      <div class="seg" role="group" aria-label="Result format">
        <button type="button" id="mFrac" data-mode="frac" aria-pressed="true">Fraction</button>
        <button type="button" id="mDec" data-mode="dec" aria-pressed="false">Decimal</button>
      </div>
      <div>
        <button id="histBtn" type="button" aria-pressed="false">History</button>
        <button id="copyBtn" type="button">Copy</button>
        <button id="calcClose" type="button" aria-label="Close calculator">✕</button>
      </div>
    </div>
    <div id="calcHist" class="hidden" aria-label="History"></div>
    <div id="calcExpr" aria-label="Expression"></div>
    <div id="calcDisp" aria-live="polite">0</div>
    <div class="hint">% = ÷100 · "of" = × · so 20% of 500 = 100</div>
    <div class="keys" id="calcKeys"></div>
  </div>
</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
/* Locale-tolerant amount parser: "1,5"->1.5, "200,000"/"200.000"->200000, "1,234.56"->1234.56 */
function parseAmount(s){
  s=String(s==null?"":s).replace(/[\s\u00a0']/g,"");
  if(!s)return 0;
  var ld=s.lastIndexOf("."),lc=s.lastIndexOf(","),last=Math.max(ld,lc);
  if(last<0)return parseFloat(s);
  var head=s.slice(0,last),tail=s.slice(last+1),cnt=(s.match(/[.,]/g)||[]).length,mixed=ld>=0&&lc>=0;
  var thousands=!mixed&&(cnt>1||(tail.length===3&&head.length>=1&&head.length<=3&&head!=="0"));
  if(thousands)return parseFloat(s.replace(/[.,]/g,""));
  return parseFloat(head.replace(/[.,]/g,"")+"."+tail);
}
var num=function(v){var n=parseAmount(v);return isFinite(n)&&n>0?n:0};
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v))};
var DPM=30.4375;

/* ---------- global state ---------- */
var CURR=[{c:"USD",l:"en-US"},{c:"EUR",l:"de-DE"},{c:"GBP",l:"en-GB"},{c:"SEK",l:"sv-SE"},{c:"CAD",l:"en-CA"},{c:"AUD",l:"en-AU"},{c:"JPY",l:"ja-JP"}];
var DEFAULTS={ver:2,module:"income",theme:"light",currency:"USD",
  wageType:"hourly",rate:"30",hours:"40",months:"12",tax:"22",
  country:"US",desired:"",
  target:"10000",current:"1500",horizon:"12",hUnit:"months",
  exp:[],incomeMode:"auto",incomeManual:"",scen:null,view:"current",pview:"monthly",rep:"summary",imgFmt:"png",lp:"250000",lr:"5",ly:"25",lx:"0",trim:"0",pTab:"costs"};
var S=Object.assign({},DEFAULTS);
function loadState(){
  try{
    var raw=localStorage.getItem("ft-state");
    if(!raw)return;
    var obj=JSON.parse(raw);
    Object.keys(DEFAULTS).forEach(function(k){if(obj[k]!==undefined)S[k]=obj[k]});
    if(obj.ver!==2)S.theme="light";S.ver=2;
  }catch(e){}
}
function saveState(){try{localStorage.setItem("ft-state",JSON.stringify(S))}catch(e){}}
function clrBtn(k){return S[k]?'<button type="button" class="clr" data-clr="'+k+'" aria-label="Clear field">×</button>':''}

function money(n,code,dig){
  var cc=code||S.currency,cur=CURR.filter(function(x){return x.c===cc})[0]||CURR[0];
  try{return new Intl.NumberFormat(cur.l,{style:"currency",currency:cur.c,maximumFractionDigits:dig||0,minimumFractionDigits:dig||0}).format(isFinite(n)?n:0)}
  catch(e){return "$"+Math.round(n||0)}
}

function SYM(){
  try{var pt=new Intl.NumberFormat((CURR.filter(function(x){return x.c===S.currency})[0]||CURR[0]).l,{style:"currency",currency:S.currency}).formatToParts(0).filter(function(x){return x.type==="currency"});return pt[0]?pt[0].value:S.currency}
  catch(e){return S.currency}
}
/* ---------- finance math (single source of truth) ---------- */
function income(){
  var months=Math.min(12,num(S.months)),tax=Math.min(100,num(S.tax));
  var gross=S.wageType==="hourly"?num(S.rate)*num(S.hours)*(52/12)*months:num(S.rate)*months;
  var t=gross*tax/100;

function savings(){

  var days=m?h*DPM:h,rem=Math.max(0,target-cur),perDay=days>0?rem/days:0;

  return{target:target,current:cur,rem:rem,perDay:perDay,perWeek:perDay*7,perMonth:perDay*DPM,data:data,

 ["DE","Germany","EUR",[16000,27000,46000,75000,110000,190000]],["FR","France","EUR",[15000,25000,42000,68000,100000,175000]],
 ["CA","Canada","CAD",[16000,28000,48000,80000,120000,220000]],["AU","Australia","AUD",[18000,30000,52000,88000,130000,240000]],
 ["SE","Sweden","SEK",[17000,27000,44000,70000,100000,170000]],["JP","Japan","JPY",[15000,24000,38000,62000,90000,160000]]];
/* each country's thresholds are stored in ITS OWN currency (derived from the baseline above) */
var COUNTRIES=BASE.map(function(b){return{c:b[0],n:b[1],cur:b[2],p:b[3].map(function(v){return Math.round(v*FX[b[2]]/100)*100})}});

function ordinal(n){
  n=Math.round(n);
  var t=n%100;
  if(t>=11&&t<=13)return n+"th";
  if(n%10===1)return n+"st";
  if(n%10===2)return n+"nd";
  if(n%10===3)return n+"rd";
  return n+"th";
}
function percentileOf(gross,thresholds){
  if(gross<=0)return{pct:0,idx:0};
  if(gross<thresholds[0])return{pct:(gross/thresholds[0])*10,idx:0};
  for(var i=0;i<thresholds.length-1;i++){
    if(gross<thresholds[i+1]){
      var f=(gross-thresholds[i])/(thresholds[i+1]-thresholds[i]);
      return{pct:PCT[i]+f*(PCT[i+1]-PCT[i]),idx:i+1};
    }
  }
  return{pct:Math.min(99.9,99+((gross-thresholds[5])/thresholds[5])*.9),idx:6};
}

/* ---------- interactivity helpers ---------- */
function morph(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b);return}
  if(a.nodeType===3){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
  if(a.nodeType!==1)return;
  var i,nm=a.nodeName;
  for(i=a.attributes.length-1;i>=0;i--){var n=a.attributes[i].name;if(!b.hasAttribute(n))a.removeAttribute(n)}
  for(i=0;i<b.attributes.length;i++){var at=b.attributes[i];if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value)}
  if((nm==="INPUT"||nm==="SELECT")&&document.activeElement!==a){
    if(nm==="SELECT")a.value=b.value;else if(a.type==="checkbox")a.checked=b.checked;else{var bv=b.getAttribute("value")||"";if(a.value!==bv)a.value=bv}
  }
  var bc=Array.prototype.slice.call(b.childNodes),ac=a.childNodes;
  for(i=0;i<bc.length;i++){if(i<ac.length)morph(ac[i],bc[i]);else a.appendChild(bc[i])}
  while(ac.length>bc.length)a.removeChild(a.lastChild);
}

}

function ringParts(inc,spent,cx,cy,r,sw,pos,neg,track){

  if(!(inc>0))return o;
  if(spent>inc)return o+seg(0,1,neg,.4);
  var f=Math.min(1,Math.max(0,spent/inc));
  return o+seg(0,f,pos,.35)+seg(f,1,pos,1);
}

/* ---------- loan & debt ---------- */
function amort(Pn,ratePct,years,extra){
  var n=Math.min(600,Math.round(years*12)),r=ratePct/1200;
  if(!(Pn>0)||n<=0)return null;
  var pay=r>0?Pn*r/(1-Math.pow(1+r,-n)):Pn/n,bal=Pn,tot=0,m=0,pts=[{x:0,y:Pn}];
  while(bal>0.005&&m<n+1){var i=bal*r,pr=Math.min(bal,pay+extra-i);bal-=pr;tot+=i;m++;pts.push({x:m,y:Math.max(bal,0)})}
  return{pay:pay,months:m,interest:tot,total:Pn+tot,pts:pts};
}
function loanCalc(){var a=num(S.lp),r=Math.min(100,num(S.lr)),y=num(S.ly),x=num(S.lx);return{std:amort(a,r,y,0),ext:x>0?amort(a,r,y,x):null,x:x}}
function payoff(mo){var d=new Date();d.setMonth(d.getMonth()+mo);var cur=CURR.filter(function(c){return c.c===S.currency})[0]||CURR[0];return d.toLocaleDateString(cur.l,{month:"short",year:"numeric"})}

  '<div class="split"><div class="panel"><h3>Loan</h3>'+

   '<input class="rng" type="range" min="0" max="'+Math.max(1000,Math.round((s0?s0.pay:500)*2/50)*50)+'" step="10" value="'+S.lx+'" data-k="lx" aria-label="Extra payment per month" style="margin-top:8px">'+
   (L.ext?'<div class="note">With extra: payoff '+payoff(L.ext.months)+' instead of '+payoff(s0.months)+'.</div>':'<div class="note">Add an extra monthly payment to see interest and time saved. Terms cap at 50 years; monthly payments assumed.</div>')+'</div>'+

/* ---------- calculator: exact rational engine (BigInt) with float fallback ---------- */
var B=BigInt;
function babs(a){return a<0n?-a:a}
function bgcd(a,b){a=babs(a);b=babs(b);while(b){var t=a%b;a=b;b=t}return a}
function R(n,d){if(d===0n)throw new Error("div0");if(d<0n){n=-n;d=-d}var g=bgcd(n,d)||1n;return{n:n/g,d:d/g}}
function isR(v){return v.n!==undefined}
function toF(v){return isR(v)?Number(v.n)/Number(v.d):v.x}
function fin(v){if(v.x!==undefined&&!isFinite(v.x))throw new Error("overflow");return v}
function op(a,b,o){
  if(isR(a)&&isR(b)){
    if(o==="+")return R(a.n*b.d+b.n*a.d,a.d*b.d);
    if(o==="-")return R(a.n*b.d-b.n*a.d,a.d*b.d);
    if(o==="*")return R(a.n*b.n,a.d*b.d);
    if(b.n===0n)throw new Error("div0");
    return R(a.n*b.d,a.d*b.n);
  }
  var x=toF(a),y=toF(b);
  if(o==="/"&&y===0)throw new Error("div0");
  return fin({x:o==="+"?x+y:o==="-"?x-y:o==="*"?x*y:x/y});
}
function pow(a,b){
  if(isR(a)&&isR(b)&&b.d===1n&&babs(b.n)<=400n){
    var e=B(Number(babs(b.n))),n=a.n**e,d=a.d**e;
    if(b.n<0n){if(a.n===0n)throw new Error("div0");return R(d,n)}
    return R(n,d);
  }
  var x=toF(a),y=toF(b);
  if(x<0&&y%1!==0)throw new Error("domain");
  if(x===0&&y<0)throw new Error("div0");
  return fin({x:Math.pow(x,y)});
}
function isqrt(n){if(n<2n)return n;var x=n,y=(x+1n)/2n;while(y<x){x=y;y=(x+n/x)/2n}return x}
function sqrt(a){
  if(toF(a)<0)throw new Error("domain");
  if(isR(a)){var p=isqrt(a.n),q=isqrt(a.d);if(p*p===a.n&&q*q===a.d)return R(p,q)}
  return fin({x:Math.sqrt(toF(a))});
}
var CALC={expr:"",mode:"frac",hist:[],ans:null,fresh:false,histOpen:false,err:"",cur:null};
try{var cs=JSON.parse(localStorage.getItem("ft-calc")||"{}");if(cs.mode==="dec"||cs.mode==="frac")CALC.mode=cs.mode;if(Array.isArray(cs.hist))CALC.hist=cs.hist.slice(-20)}catch(e){}
function calcSave(){try{localStorage.setItem("ft-calc",JSON.stringify({mode:CALC.mode,hist:CALC.hist}))}catch(e){}}
/* grammar: expr=term(('+'|'-')term)* ; term=unary(('×'|'÷'|'of')unary)* ; unary='-'unary|power ; power=post('^'unary)? ; post=atom'%'* */
function evaluate(src){
  var t=src.replace(/\s+/g,""),i=0;
  function eat(s){if(t.substr(i,s.length)===s){i+=s.length;return true}return false}
  function expr(){var v=term();for(;;){if(eat("+"))v=op(v,term(),"+");else if(eat("−")||eat("-"))v=op(v,term(),"-");else return v}}
  function term(){var v=unary();for(;;){if(eat("×")||eat("*")||eat("of"))v=op(v,unary(),"*");else if(eat("÷")||eat("/"))v=op(v,unary(),"/");else return v}}
  function unary(){if(eat("−")||eat("-")){var u=unary();return isR(u)?R(-u.n,u.d):{x:-u.x}}if(eat("+"))return unary();return power()}
  function power(){var b=post();return eat("^")?pow(b,unary()):b}
  function post(){var v=atom();while(eat("%"))v=op(v,{n:100n,d:1n},"/");return v}
  function atom(){
    if(eat("(")){var v=expr();if(!eat(")"))throw new Error("paren");return v}
    if(eat("√"))return sqrt(atom());
    if(eat("Ans"))return CALC.ans||{n:0n,d:1n};
    var m=/^(\d*)\.?(\d*)/.exec(t.slice(i));
    if(!m||(m[1]===""&&m[2]===""))throw new Error("syntax");
    i+=m[0].length;
    return R(B((m[1]||"0")+m[2]),10n**B(m[2].length));
  }
  if(!t)return{n:0n,d:1n};
  var r=expr();if(i<t.length)throw new Error("syntax");return r;
}
function decStr(v){
  if(!isR(v)){var x=v.x,a=Math.abs(x);return{s:x===0?"0":(a>=1e15||a<1e-9)?x.toExponential(8).replace(/\.?0+e/,"e"):String(parseFloat(x.toPrecision(12))),exact:false}}
  var neg=v.n<0n,n=babs(v.n),sc=10n**12n,q=(n*sc*2n+v.d)/(2n*v.d),ip=q/sc;
  if(ip.toString().length>18){var f=toF(v);if(!isFinite(f))throw new Error("overflow");return{s:f.toExponential(8).replace(/\.?0+e/,"e"),exact:false}}
  var fp=(q%sc).toString().padStart(12,"0").replace(/0+$/,"");
  return{s:(neg&&q!==0n?"-":"")+ip+(fp?"."+fp:""),exact:(n*sc)%v.d===0n};
}
function fmt(v,mode){
  if(mode==="frac"&&isR(v)&&v.d!==1n&&babs(v.n).toString().length<=9&&v.d.toString().length<=9){
    return{html:(v.n<0n?"−":"")+'<span class="frac"><b>'+babs(v.n)+'</b><i>'+v.d+'</i></span>',text:v.n+"/"+v.d};
  }
  var d=decStr(v);
  return{html:(d.exact?"":"≈ ")+d.s,text:(d.exact?"":"≈ ")+d.s};
}
var MSG={div0:"Cannot divide by zero",overflow:"Result too large",domain:"Undefined result",paren:"Check parentheses",syntax:"Incomplete expression"};
function calcRender(){
  var ex=$("calcExpr"),out=$("calcDisp");
  ex.textContent=CALC.expr;ex.scrollLeft=1e6;
  CALC.cur=null;
  if(CALC.err)out.innerHTML='<span class="err">'+CALC.err+'</span>';
  else try{CALC.cur=fmt(evaluate(CALC.expr),CALC.mode);out.innerHTML=CALC.cur.html}catch(e){out.innerHTML='<span class="dim">…</span>'}
  var L=(out.textContent||"").length;out.className=L>18?"s2":L>12?"s1":"";
  $("mFrac").setAttribute("aria-pressed",String(CALC.mode==="frac"));$("mDec").setAttribute("aria-pressed",String(CALC.mode==="dec"));
  var h=$("calcHist");h.classList.toggle("hidden",!CALC.histOpen);$("histBtn").setAttribute("aria-pressed",String(CALC.histOpen));
  h.innerHTML=CALC.hist.length?CALC.hist.map(function(x,i){return '<button type="button" data-h="'+i+'">'+esc(x.e)+' = '+esc(x.t)+'</button>'}).reverse().join(""):'<div class="dim" style="font-size:.78rem;padding:4px 2px;text-align:right">No calculations yet</div>';
}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var KEYS=[["AC","acc"],["⌫","op"],["(",""],[")",""],["7",""],["8",""],["9",""],["÷","op"],["4",""],["5",""],["6",""],["×","op"],["1",""],["2",""],["3",""],["−","op"],["0",""],[".",""],["^","op"],["+","op"],["±","op"],["√","op"],["of","op"],["%","op"],["Ans",""],["=","eq wide"]];
var BIN=["+","×","÷","^","of"],POSTOP=["%"];
function buildKeys(){$("calcKeys").innerHTML=KEYS.map(function(k){return '<button type="button" class="'+k[1]+'" data-key="'+k[0]+'">'+k[0]+'</button>'}).join('')}
function calcPress(k){
  CALC.err="";
  if(k==="AC"){CALC.expr="";CALC.fresh=false;return calcRender()}
  if(k==="⌫"){var e=CALC.expr;CALC.expr=/of$/.test(e)?e.slice(0,-2):/Ans$/.test(e)?e.slice(0,-3):e.slice(0,-1);CALC.fresh=false;return calcRender()}
  if(k==="="){
    if(!CALC.expr)return calcRender();
    try{
      var v=evaluate(CALC.expr),f=fmt(v,"dec");
      CALC.ans=v;CALC.hist.push({e:CALC.expr,t:f.text});CALC.hist=CALC.hist.slice(-20);calcSave();CALC.fresh=true;
    }catch(e){CALC.err=MSG[e.message]||"Error"}
    return calcRender();
  }
  var isOp=BIN.indexOf(k)>-1||POSTOP.indexOf(k)>-1||k==="^";
  if(CALC.fresh){CALC.expr=isOp?"Ans":"";CALC.fresh=false}
  var ex=CALC.expr;
  if(k==="±"){
    var m=/(−)?(\d+\.?\d*|\.\d+)$/.exec(ex);
    CALC.expr=m?ex.slice(0,ex.length-m[0].length)+(m[1]?"":"−")+m[2]:ex+"−";
    return calcRender();
  }
  if(k==="."&&/\d*\.\d*$/.test(ex)&&/[\d.]$/.test(ex)){return calcRender()}
  if(BIN.indexOf(k)>-1){
    if(ex==="")ex="Ans";
    else if(/(\+|×|÷|\^|of)$/.test(ex))ex=ex.replace(/(\+|×|÷|\^|of)$/,"");
    CALC.expr=ex+k;return calcRender();
  }
  if(k==="%"&&(ex===""||/(\+|×|÷|\^|of|−|\()$/.test(ex)))return calcRender();
  if(k==="√"||k==="Ans"||k==="("){CALC.expr=ex+(k==="√"?"√(":k);return calcRender()}
  CALC.expr=ex+k;calcRender();
}

function focusables(){
  return Array.prototype.slice.call($("calc").querySelectorAll('button:not(.hidden),[href],input,select,[tabindex]')).filter(function(el){return el.offsetParent!==null});
}
function openCalc(){$("calcOverlay").classList.add("open");calcRender();var f=focusables();if(f[0])f[0].focus()}
function closeCalc(){if(!$("calcOverlay").classList.contains("open"))return;$("calcOverlay").classList.remove("open");$("calcBtn").focus()}
document.addEventListener("keydown",function(e){
  if(!$("calcOverlay").classList.contains("open")||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==="Tab"){
    var f=focusables();if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
    return;
  }
  var map={"*":"×","/":"÷","-":"−",",":".","Enter":"=","Backspace":"⌫","=":"="},k=map[e.key]||e.key;
  if(/^[0-9.+^()%]$/.test(k)||k==="×"||k==="÷"||k==="−"||k==="="||k==="⌫"){e.preventDefault();calcPress(k)}
});
